<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResumeAI - 管理后台</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root,[data-theme="light"]{--bg:#F0F2F5;--card:#FFFFFF;--card-border:#E5E7EB;--accent:#6366F1;--accent-hover:#4F46E5;--text:#1F2937;--text-muted:#6B7280;--text-dim:#9CA3AF;--green:#10B981;--red:#EF4444;--orange:#F59E0B;--blue:#3B82F6;--cyan:#06B6D4;--shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);--input-bg:#F9FAFB;--row-hover:#F3F4F6;--badge-green-bg:#D1FAE5;--badge-green-text:#059669;--badge-red-bg:#FEE2E2;--badge-red-text:#DC2626;--badge-orange-bg:#FEF3C7;--badge-orange-text:#D97706;--badge-blue-bg:#DBEAFE;--badge-blue-text:#2563EB;--sidebar-bg:#FFFFFF;--sidebar-hover:rgba(99,102,241,.06);--sidebar-active:rgba(99,102,241,.1);--topbar-bg:rgba(255,255,255,.85)}
[data-theme="dark"]{--bg:#111318;--card:#1A1D24;--card-border:#2A2D35;--accent:#818CF8;--accent-hover:#6366F1;--text:#E8EAED;--text-muted:#9CA3AF;--text-dim:#6B7280;--green:#34D399;--red:#F87171;--orange:#FBBF24;--blue:#60A5FA;--cyan:#22D3EE;--shadow:0 1px 3px rgba(0,0,0,.4);--input-bg:#22252B;--row-hover:rgba(99,102,241,.08);--badge-green-bg:rgba(52,211,153,.12);--badge-green-text:#34D399;--badge-red-bg:rgba(248,113,113,.12);--badge-red-text:#F87171;--badge-orange-bg:rgba(251,191,36,.12);--badge-orange-text:#FBBF24;--badge-blue-bg:rgba(96,165,250,.12);--badge-blue-text:#60A5FA;--sidebar-bg:#16181D;--sidebar-hover:rgba(129,140,248,.08);--sidebar-active:rgba(129,140,248,.15);--topbar-bg:rgba(17,19,24,.85)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;transition:background .3s,color .3s}

/* Sidebar */
.sidebar{width:240px;background:var(--sidebar-bg);border-right:1px solid var(--card-border);padding:24px 0;flex-shrink:0;position:fixed;height:100vh;overflow-y:auto;box-shadow:1px 0 8px rgba(0,0,0,.04);transition:background .3s,border-color .3s}
.sidebar .logo{padding:0 24px 24px;font-size:18px;font-weight:800;border-bottom:1px solid var(--card-border);transition:border-color .3s}
.sidebar .logo span{color:var(--accent)}
.sidebar nav{padding:16px 0}
.sidebar nav a{display:flex;align-items:center;gap:10px;padding:10px 24px;color:var(--text-muted);font-size:14px;font-weight:500;transition:all .2s;cursor:pointer;border-left:3px solid transparent}
.sidebar nav a:hover{color:var(--text);background:var(--sidebar-hover)}
.sidebar nav a.active{color:var(--accent);background:var(--sidebar-active);border-left-color:var(--accent)}
.sidebar .user-box{padding:16px 24px;border-top:1px solid var(--card-border);margin-top:auto;position:absolute;bottom:0;width:100%;transition:border-color .3s}
.sidebar .user-box .name{font-size:14px;font-weight:600;color:var(--text)}
.sidebar .user-box .role{font-size:12px;color:var(--accent)}

/* Main */
.main{margin-left:240px;flex:1;padding:32px;min-height:100vh}
.page-header{margin-bottom:32px}
.page-header h1{font-size:28px;font-weight:800;letter-spacing:-0.5px;color:var(--text)}
.page-header p{color:var(--text-muted);margin-top:4px;font-size:14px}

/* Stats Cards */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px}
.stat-card{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:22px;box-shadow:var(--shadow);transition:background .3s}
.stat-card .label{font-size:13px;color:var(--text-muted);margin-bottom:8px;font-weight:500}
.stat-card .value{font-size:32px;font-weight:800;letter-spacing:-1px}
.stat-card .sub{font-size:12px;color:var(--text-dim);margin-top:4px}
.stat-card.accent .value{color:var(--accent)}
.stat-card.green .value{color:var(--green)}
.stat-card.orange .value{color:var(--orange)}
.stat-card.blue .value{color:var(--blue)}

/* Chart */
.chart-card{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:24px;margin-bottom:32px;box-shadow:var(--shadow);transition:background .3s}
.chart-card h3{font-size:16px;font-weight:700;margin-bottom:16px;color:var(--text)}
.chart-bar{display:flex;align-items:flex-end;gap:8px;height:120px}
.chart-bar .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.chart-bar .bar{width:100%;background:linear-gradient(180deg,var(--accent),#818CF8);border-radius:6px 6px 0 0;min-height:4px;transition:height .5s ease}
.chart-bar .bar-label{font-size:11px;color:var(--text-dim)}
.chart-bar .bar-value{font-size:11px;color:var(--text-muted);font-weight:600}

/* Tables */
.table-card{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:24px;margin-bottom:24px;box-shadow:var(--shadow);transition:background .3s}
.table-card .table-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.table-card .table-header h3{font-size:16px;font-weight:700;color:var(--text)}
.search-box{display:flex;gap:8px}
.search-box input{background:var(--input-bg);border:1px solid var(--card-border);border-radius:8px;padding:8px 14px;color:var(--text);font-size:13px;width:220px;outline:none;transition:border .2s}
.search-box input:focus{border-color:var(--accent)}
.search-box button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.search-box button:hover{background:var(--accent-hover)}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 12px;font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--card-border);font-weight:600}
td{padding:12px;font-size:14px;border-bottom:1px solid var(--card-border);color:var(--text)}
tr:hover{background:var(--row-hover)}

/* Badges */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-green{background:var(--badge-green-bg);color:var(--badge-green-text)}
.badge-red{background:var(--badge-red-bg);color:var(--badge-red-text)}
.badge-orange{background:var(--badge-orange-bg);color:var(--badge-orange-text)}
.badge-blue{background:var(--badge-blue-bg);color:var(--badge-blue-text)}

/* Buttons */
.btn{padding:6px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .2s}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-danger{background:var(--badge-red-bg);color:var(--badge-red-text)}
.btn-danger:hover{opacity:.8}
.btn-outline{background:transparent;color:var(--text-muted);border:1px solid var(--card-border)}
.btn-outline:hover{color:var(--text);border-color:var(--text-dim);background:var(--input-bg)}

/* Tabs */
.tabs{display:flex;gap:4px;margin-bottom:24px;background:var(--card);border:1px solid var(--card-border);border-radius:10px;padding:4px;width:fit-content;box-shadow:var(--shadow);transition:background .3s}
.tabs button{padding:8px 20px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--text-muted);transition:all .2s}
.tabs button.active{background:var(--accent);color:#fff}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:1000}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border:1px solid var(--card-border);border-radius:18px;padding:32px;width:440px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal h3{font-size:18px;font-weight:700;margin-bottom:16px;color:var(--text)}
.modal .form-group{margin-bottom:16px}
.modal label{display:block;font-size:13px;color:var(--text-muted);margin-bottom:6px}
.modal input,.modal select{width:100%;background:var(--input-bg);border:1px solid var(--card-border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;outline:none}
.modal input:focus{border-color:var(--accent)}
.modal .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

/* Toast */
.toast{position:fixed;top:24px;right:24px;background:var(--card);border:1px solid var(--green);border-radius:10px;padding:12px 20px;font-size:14px;font-weight:500;z-index:2000;transform:translateX(120%);transition:transform .3s ease;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.toast.show{transform:translateX(0)}
.toast.error{border-color:var(--red)}

/* Pages */
.page{display:none}
.page.active{display:block}
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <div class="logo"><span>Resume</span>AI 管理后台</div>
  <nav>
    <a class="active" onclick="showPage('dashboard')">📊 数据总览</a>
    <a onclick="showPage('users')">👥 用户管理</a>
    <a onclick="showPage('resumes')">📄 简历管理</a>
    <a onclick="showPage('apikeys')">🔑 API Key</a>
    <a onclick="showPage('config')">⚙️ 系统配置</a>
  </nav>
  <div class="user-box">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <div class="name" id="adminName">管理员</div>
      <button onclick="toggleTheme()" id="themeBtn" style="width:32px;height:32px;border-radius:8px;border:1px solid var(--card-border);background:var(--card);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .2s">🌙</button>
    </div>
    <div class="role">Admin</div>
    <button class="btn btn-outline" style="margin-top:8px;width:100%" onclick="logout()">退出登录</button>
  </div>
</div>

<!-- Main Content -->
<div class="main">

<!-- Dashboard -->
<div class="page active" id="page-dashboard">
  <div class="page-header">
    <h1>数据总览</h1>
    <p>系统运行状态与核心指标</p>
  </div>
  <div class="stats-grid" id="statsGrid"></div>
  <div class="chart-card">
    <h3>近7天简历优化趋势</h3>
    <div class="chart-bar" id="dailyChart"></div>
  </div>
  <div class="chart-card">
    <h3>各模型提供商调用统计</h3>
    <div id="providerStats"></div>
  </div>
</div>

<!-- Users -->
<div class="page" id="page-users">
  <div class="page-header">
    <h1>用户管理</h1>
    <p>查看、管理所有注册用户</p>
  </div>
  <div class="table-card">
    <div class="table-header">
      <h3>用户列表</h3>
      <div class="search-box">
        <input type="text" id="userSearch" placeholder="搜索用户名..." onkeyup="if(event.key==='Enter')loadUsers()">
        <button onclick="loadUsers()">搜索</button>
      </div>
    </div>
    <table>
      <thead>
        <tr><th>ID</th><th>用户名</th><th>角色</th><th>状态</th><th>简历数</th><th>注册时间</th><th>操作</th></tr>
      </thead>
      <tbody id="userTable"></tbody>
    </table>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px">
      <span id="userTotal" style="font-size:13px;color:var(--text-dim)"></span>
      <div style="display:flex;gap:8px">
        <button class="btn btn-outline btn-sm" onclick="userPage(-1)">上一页</button>
        <button class="btn btn-outline btn-sm" onclick="userPage(1)">下一页</button>
      </div>
    </div>
  </div>
</div>

<!-- Resumes -->
<div class="page" id="page-resumes">
  <div class="page-header">
    <h1>简历管理</h1>
    <p>查看、管理所有优化记录</p>
  </div>
  <div class="table-card">
    <div class="table-header">
      <h3>简历列表</h3>
      <div class="search-box">
        <input type="number" id="resumeUserFilter" placeholder="按用户ID筛选" style="width:140px">
        <button onclick="loadResumes()">筛选</button>
      </div>
    </div>
    <table>
      <thead>
        <tr><th>ID</th><th>用户</th><th>ATS评分</th><th>JD匹配</th><th>创建时间</th><th>操作</th></tr>
      </thead>
      <tbody id="resumeTable"></tbody>
    </table>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px">
      <span id="resumeTotal" style="font-size:13px;color:var(--text-dim)"></span>
      <div style="display:flex;gap:8px">
        <button class="btn btn-outline btn-sm" onclick="resumePage(-1)">上一页</button>
        <button class="btn btn-outline btn-sm" onclick="resumePage(1)">下一页</button>
      </div>
    </div>
  </div>
</div>

<!-- API Keys -->
<div class="page" id="page-apikeys">
  <div class="page-header">
    <h1>API Key 管理</h1>
    <p>查看所有用户的 API Key 配置</p>
  </div>
  <div class="table-card">
    <table>
      <thead>
        <tr><th>ID</th><th>用户</th><th>提供商</th><th>API Key</th><th>状态</th><th>创建时间</th></tr>
      </thead>
      <tbody id="apikeyTable"></tbody>
    </table>
  </div>
</div>

<!-- Config -->
<div class="page" id="page-config">
  <div class="page-header">
    <h1>系统配置</h1>
    <p>查看当前系统配置信息</p>
  </div>
  <div class="table-card">
    <h3 style="margin-bottom:16px">模型提供商配置</h3>
    <div id="configInfo"></div>
  </div>
</div>

</div>

<!-- Reset Password Modal -->
<div class="modal-overlay" id="resetModal">
  <div class="modal">
    <h3>重置密码</h3>
    <div class="form-group">
      <label>新密码</label>
      <input type="password" id="newPassword" placeholder="至少6位">
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal('resetModal')">取消</button>
      <button class="btn btn-primary" onclick="confirmReset()">确认重置</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const API = '';
let token = localStorage.getItem('token');
let currentUser = null;
let userP = 1, resumeP = 1;
let resetUserId = null;

if (!token) location.href = '/login';

function headers() { return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }; }

async function api(url, opts = {}) {
  const res = await fetch(API + url, { ...opts, headers: { ...headers(), ...opts.headers } });
  if (res.status === 401) { location.href = '/login'; return null; }
  if (res.status === 403) { showToast('需要管理员权限', true); return null; }
  if (!res.ok) { const e = await res.json().catch(() => ({})); showToast(e.detail || '请求失败', true); return null; }
  return res.json();
}

function showToast(msg, err) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (err ? ' error' : '');
  setTimeout(() => t.className = 'toast', 3000);
}

function closeModal(id) { document.getElementById(id).classList.remove('show'); }

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelectorAll('.sidebar nav a').forEach(a => a.classList.remove('active'));
  event.target.classList.add('active');
  if (name === 'dashboard') loadDashboard();
  if (name === 'users') loadUsers();
  if (name === 'resumes') loadResumes();
  if (name === 'apikeys') loadApiKeys();
  if (name === 'config') loadConfig();
}

function logout() {
  localStorage.removeItem('token');
  localStorage.removeItem('username');
  location.href = '/login';
}

// ===== Dashboard =====
async function loadDashboard() {
  const data = await api('/admin/stats');
  if (!data) return;

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card accent"><div class="label">总用户数</div><div class="value">${data.total_users}</div><div class="sub">今日新增 ${data.today_users}</div></div>
    <div class="stat-card green"><div class="label">总优化次数</div><div class="value">${data.total_resumes}</div><div class="sub">今日 ${data.today_resumes}</div></div>
    <div class="stat-card orange"><div class="label">API 调用次数</div><div class="value">${data.total_api_calls}</div><div class="sub">总 token ${formatNum(data.total_tokens)}</div></div>
    <div class="stat-card blue"><div class="label">团队数量</div><div class="value">${data.total_teams}</div><div class="sub">预估费用 $${data.total_cost_usd.toFixed(2)}</div></div>
  `;

  // Daily chart
  const maxCount = Math.max(...data.daily_trend.map(d => d.count), 1);
  document.getElementById('dailyChart').innerHTML = data.daily_trend.map(d => `
    <div class="col">
      <div class="bar-value">${d.count}</div>
      <div class="bar" style="height:${(d.count / maxCount) * 100}px"></div>
      <div class="bar-label">${d.date.slice(5)}</div>
    </div>
  `).join('');

  // Provider stats
  const providers = Object.entries(data.by_provider);
  document.getElementById('providerStats').innerHTML = providers.length ? `
    <table><thead><tr><th>提供商</th><th>调用次数</th><th>Token 消耗</th></tr></thead>
    <tbody>${providers.map(([k, v]) => `<tr><td>${k}</td><td>${v.calls}</td><td>${formatNum(v.tokens)}</td></tr>`).join('')}</tbody></table>
  ` : '<p style="color:var(--text-dim)">暂无数据</p>';
}

function formatNum(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
  return n;
}

// ===== Users =====
async function loadUsers() {
  const search = document.getElementById('userSearch').value;
  const data = await api(`/admin/users?page=${userP}&size=20${search ? '&search=' + search : ''}`);
  if (!data) return;

  document.getElementById('userTable').innerHTML = data.items.map(u => `
    <tr>
      <td>${u.id}</td>
      <td><strong>${u.username}</strong></td>
      <td>${u.is_admin ? '<span class="badge badge-orange">管理员</span>' : '<span class="badge badge-blue">普通用户</span>'}</td>
      <td>${u.is_active ? '<span class="badge badge-green">正常</span>' : '<span class="badge badge-red">已禁用</span>'}</td>
      <td>${u.resume_count}</td>
      <td style="font-size:12px;color:var(--text-dim)">${new Date(u.created_at).toLocaleDateString()}</td>
      <td style="display:flex;gap:6px">
        <button class="btn btn-outline btn-sm" onclick="toggleAdmin(${u.id},${u.is_admin})">${u.is_admin ? '取消管理员' : '设为管理员'}</button>
        <button class="btn btn-outline btn-sm" onclick="toggleActive(${u.id},${u.is_active})">${u.is_active ? '禁用' : '启用'}</button>
        <button class="btn btn-outline btn-sm" onclick="openReset(${u.id})">重置密码</button>
        <button class="btn btn-danger btn-sm" onclick="deleteUser(${u.id})">删除</button>
      </td>
    </tr>
  `).join('');
  document.getElementById('userTotal').textContent = `共 ${data.total} 条`;
}

function userPage(d) { userP = Math.max(1, userP + d); loadUsers(); }

async function toggleAdmin(id, current) {
  await api(`/admin/users/${id}?is_admin=${current ? 0 : 1}`, { method: 'PUT' });
  loadUsers();
}

async function toggleActive(id, current) {
  await api(`/admin/users/${id}?is_active=${current ? 0 : 1}`, { method: 'PUT' });
  loadUsers();
}

async function deleteUser(id) {
  if (!confirm('确认删除该用户？')) return;
  await api(`/admin/users/${id}`, { method: 'DELETE' });
  loadUsers();
  showToast('已删除');
}

function openReset(id) {
  resetUserId = id;
  document.getElementById('newPassword').value = '';
  document.getElementById('resetModal').classList.add('show');
}

async function confirmReset() {
  const pwd = document.getElementById('newPassword').value;
  if (pwd.length < 6) { showToast('密码至少6位', true); return; }
  await api(`/admin/users/${resetUserId}/reset-password?new_password=${encodeURIComponent(pwd)}`, { method: 'POST' });
  closeModal('resetModal');
  showToast('密码已重置');
}

// ===== Resumes =====
async function loadResumes() {
  const uid = document.getElementById('resumeUserFilter').value;
  const data = await api(`/admin/resumes?page=${resumeP}&size=20${uid ? '&user_id=' + uid : ''}`);
  if (!data) return;

  document.getElementById('resumeTable').innerHTML = data.items.map(r => `
    <tr>
      <td>${r.id}</td>
      <td>${r.username} <span style="color:var(--text-dim);font-size:12px">(ID:${r.user_id})</span></td>
      <td><span class="badge ${r.ats_score >= 80 ? 'badge-green' : r.ats_score >= 60 ? 'badge-orange' : 'badge-red'}">${r.ats_score}</span></td>
      <td>${r.jd_match_score != null ? '<span class="badge badge-blue">' + r.jd_match_score + '</span>' : '-'}</td>
      <td style="font-size:12px;color:var(--text-dim)">${new Date(r.created_at).toLocaleString()}</td>
      <td><button class="btn btn-danger btn-sm" onclick="deleteResume(${r.id})">删除</button></td>
    </tr>
  `).join('');
  document.getElementById('resumeTotal').textContent = `共 ${data.total} 条`;
}

function resumePage(d) { resumeP = Math.max(1, resumeP + d); loadResumes(); }

async function deleteResume(id) {
  if (!confirm('确认删除该简历？')) return;
  await api(`/admin/resumes/${id}`, { method: 'DELETE' });
  loadResumes();
  showToast('已删除');
}

// ===== API Keys =====
async function loadApiKeys() {
  const data = await api('/admin/api-keys');
  if (!data) return;

  document.getElementById('apikeyTable').innerHTML = data.map(k => `
    <tr>
      <td>${k.id}</td>
      <td>${k.username} <span style="color:var(--text-dim);font-size:12px">(ID:${k.user_id})</span></td>
      <td><span class="badge badge-blue">${k.provider}</span></td>
      <td style="font-family:monospace;font-size:13px">${k.api_key}</td>
      <td>${k.is_active ? '<span class="badge badge-green">启用</span>' : '<span class="badge badge-red">禁用</span>'}</td>
      <td style="font-size:12px;color:var(--text-dim)">${new Date(k.created_at).toLocaleDateString()}</td>
    </tr>
  `).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--text-dim)">暂无数据</td></tr>';
}

// ===== Config =====
async function loadConfig() {
  const data = await api('/admin/config');
  if (!data) return;

  const providers = Object.entries(data.providers);
  document.getElementById('configInfo').innerHTML = `
    <p style="margin-bottom:12px;color:var(--text-muted)">默认提供商: <strong style="color:var(--accent)">${data.default_provider}</strong></p>
    <table>
      <thead><tr><th>提供商</th><th>模型</th><th>Base URL</th></tr></thead>
      <tbody>${providers.map(([k, v]) => `<tr><td>${k}</td><td>${v.model}</td><td style="font-size:12px;color:var(--text-dim)">${v.base_url}</td></tr>`).join('')}</tbody>
    </table>
  `;
}

// ===== Init =====
(async function() {
  applyTheme(localStorage.getItem('theme') || 'light');
  const me = await api('/auth/me');
  if (!me) return;
  if (!me.is_admin) { showToast('需要管理员权限', true); setTimeout(() => location.href = '/', 1500); return; }
  currentUser = me;
  document.getElementById('adminName').textContent = me.username;
  loadDashboard();
})();

// Theme toggle
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  const next = cur === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', next);
  applyTheme(next);
}
</script>
</body>
</html>
