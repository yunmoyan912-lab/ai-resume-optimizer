version: "3.8"

services:
  mysql:
    image: mysql:5.7
    container_name: resume_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "***"
      MYSQL_DATABASE: resume_db
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build: .
    container_name: resume_backend
    restart: always
    depends_on:
      - mysql
    env_file:
      - .env
    volumes:
      - ./secrets.json:/app/secrets.json:ro
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  mysql_data:
